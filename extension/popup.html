<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 12px;
        font: 13px/1.4 system-ui, sans-serif;
        background: #0a0a0a;
        color: #e5e5e5;
      }
      h1 {
        font-size: 13px;
        margin: 0 0 8px;
        color: #fff;
      }
      .row {
        margin: 6px 0;
      }
      .muted {
        color: #888;
      }
      .ok {
        color: #34d399;
      }
      .warn {
        color: #fbbf24;
      }
      .err {
        color: #f87171;
      }
      input,
      textarea {
        width: 100%;
        box-sizing: border-box;
        background: #171717;
        border: 1px solid #333;
        color: #e5e5e5;
        border-radius: 4px;
        padding: 4px 6px;
        font: inherit;
        resize: vertical;
      }
      button {
        margin-top: 6px;
        background: #0284c7;
        color: #fff;
        border: 0;
        border-radius: 4px;
        padding: 5px 10px;
        cursor: pointer;
        font: inherit;
      }
      button:hover {
        background: #0369a1;
      }
      code {
        font-size: 11px;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <h1>Pluto Token Bridge</h1>
    <div class="row" id="status">Loading…</div>
    <div class="row muted" id="push"></div>
    <div class="row">
      <label class="muted" for="appBases">App URLs (one per line)</label>
      <textarea id="appBases" rows="3" placeholder="http://localhost:3137&#10;http://157.250.198.27:9090"></textarea>
    </div>
    <button id="save">Save URLs</button>
    <button id="resend">Resend token</button>
    <script src="popup.js"></script>
  </body>
</html>
